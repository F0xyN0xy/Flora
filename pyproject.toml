[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flora-chess"
version = "0.1.0"
description = "An experimental AlphaZero-inspired chess engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
training = ["torch>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
